<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TUNG LINH BYPASS</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background:#0a0a0a;
            color:#00ff88;
            font-family:'Courier New',monospace;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:15px;
        }
        .container {
            background:#111;
            border:2px solid #00ff88;
            border-radius:15px;
            padding:25px;
            max-width:600px;
            width:100%;
            text-align:center;
        }
        h1 { font-size:22px; margin-bottom:5px; letter-spacing:2px; }
        .credit { color:#ffcc00; font-size:12px; margin-bottom:15px; }
        .input-group { margin-bottom:10px; text-align:left; }
        label { display:block; font-size:10px; margin-bottom:4px; color:#ccc; text-transform:uppercase; }
        input {
            width:100%; padding:13px; background:#000;
            border:1px solid #333; border-radius:6px;
            color:#fff; font-size:13px;
        }
        .btn {
            width:100%; padding:14px; background:#00ff88;
            border:none; border-radius:6px; color:#000;
            font-weight:700; cursor:pointer; margin-top:8px;
        }
        .btn:disabled { background:#333; color:#666; }
        .spinner {
            display:inline-block; width:16px; height:16px;
            border:2px solid #333; border-top-color:#00ff88;
            border-radius:50%; animation:spin 0.8s linear infinite;
            margin-right:8px; vertical-align:middle;
        }
        @keyframes spin { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
        .result-box {
            margin-top:12px; padding:15px; background:#000;
            border:2px solid #ffcc00; border-radius:8px;
            display:none;
        }
        .result-box.show { display:block; }
        .key-output {
            font-size:14px; font-weight:700; color:#000;
            background:#fff; padding:12px; border-radius:6px;
            word-break:break-all;
        }
        .btn-copy {
            width:100%; padding:10px; background:#ffcc00;
            border:none; border-radius:6px; color:#000;
            font-weight:700; cursor:pointer; margin-top:8px;
        }
        .log-box {
            margin-top:12px; padding:10px; background:#000;
            border:1px solid #222; border-radius:6px;
            max-height:200px; overflow-y:auto;
            text-align:left; font-size:10px;
        }
        .log-entry { color:#888; padding:2px; }
        .log-entry.success { color:#00ff88; }
        .log-entry.error { color:#ff4444; }
        .log-entry.info { color:#4488ff; }
        .footer { margin-top:12px; font-size:9px; color:#555; }
    </style>
</head>
<body>
    <div class="container">
        <h1>TUNG LINH BYPASS</h1>
        <div class="credit">⚡ DÁN LINK -> AUTO BYPASS ⚡</div>

        <div class="input-group">
            <label>📎 DÁN LINK CẦN BYPASS</label>
            <input type="url" id="inputLink" placeholder="https://linkvertise.com/...">
        </div>

        <button class="btn" id="btnBypass" onclick="submitLink()">
            <span id="btnText">⚡ BYPASS LINK ⚡</span>
        </button>

        <div class="result-box" id="resultBox">
            <div style="color:#ccc;font-size:11px;margin-bottom:8px;">✅ KẾT QUẢ:</div>
            <div class="key-output" id="keyOutput">...</div>
            <button class="btn-copy" onclick="copyKey()">📋 SAO CHÉP</button>
        </div>

        <div class="log-box" id="logBox">
            <div class="log-entry info">[TUNG LINH] Sẵn sàng...</div>
        </div>

        <div class="footer">© 2026 TUNG LINH BYPASS</div>
    </div>

    <script>
        const GITHUB_TOKEN = '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';
        const REPO = 'tunglinh-png/tunglinh-bypass-engine';
        
        let currentResult = '';

        function addLog(msg, type) {
            const box = document.getElementById('logBox');
            const div = document.createElement('div');
            div.className = 'log-entry ' + (type || 'info');
            div.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

        async function submitLink() {
            const link = document.getElementById('inputLink').value.trim();
            const btn = document.getElementById('btnBypass');
            const btnText = document.getElementById('btnText');
            
            if (!link) {
                addLog('Nhập link!', 'error');
                return;
            }
            
            btn.disabled = true;
            btnText.innerHTML = '<span class="spinner"></span>ĐANG GỬI...';
            document.getElementById('resultBox').classList.remove('show');
            
            addLog('Gửi link lên GitHub...', 'info');
            
            try {
                // Bước 1: Lưu link vào link.txt
                const putResponse = await fetch(
                    `https://api.github.com/repos/${REPO}/contents/link.txt`,
                    {
                        method: 'PUT',
                        headers: {
                            'Authorization': 'Bearer ' + GITHUB_TOKEN,
                            'Content-Type': 'application/json',
                            'Accept': 'application/vnd.github.v3+json',
                        },
                        body: JSON.stringify({
                            message: 'Update bypass link',
                            content: btoa(unescape(encodeURIComponent(link))),
                        }),
                    }
                );
                
                if (!putResponse.ok) {
                    const errorData = await putResponse.json();
                    throw new Error('Gửi link lỗi: ' + (errorData.message || putResponse.status));
                }
                
                addLog('Link đã gửi thành công!', 'success');
                
                // Bước 2: Trigger workflow
                btnText.innerHTML = '<span class="spinner"></span>KÍCH HOẠT WORKFLOW...';
                
                const dispatchResponse = await fetch(
                    `https://api.github.com/repos/${REPO}/actions/workflows/bypass.yml/dispatches`,
                    {
                        method: 'POST',
                        headers: {
                            'Authorization': 'Bearer ' + GITHUB_TOKEN,
                            'Content-Type': 'application/json',
                            'Accept': 'application/vnd.github.v3+json',
                        },
                        body: JSON.stringify({ ref: 'main' }),
                    }
                );
                
                if (!dispatchResponse.ok) {
                    throw new Error('Kích hoạt workflow lỗi');
                }
                
                addLog('Workflow đã kích hoạt!', 'success');
                addLog('Chờ 45 giây cho workflow chạy...', 'info');
                
                // Bước 3: Chờ và đọc kết quả
                btnText.innerHTML = '<span class="spinner"></span>ĐANG CHỜ KẾT QUẢ...';
                
                await sleep(45000);
                
                // Thử đọc results.json (thử 3 lần)
                let key = '';
                for (let i = 0; i < 3; i++) {
                    const resultResponse = await fetch(
                        `https://raw.githubusercontent.com/${REPO}/main/results.json?cache=${Date.now()}`
                    );
                    
                    if (resultResponse.ok) {
                        const data = await resultResponse.json();
                        if (data.key && data.key !== 'KHÔNG BYPASS ĐƯỢC') {
                            key = data.key;
                            break;
                        }
                    }
                    
                    addLog('Chưa có kết quả - thử lại...', 'info');
                    await sleep(15000);
                }
                
                if (key) {
                    currentResult = key;
                    document.getElementById('keyOutput').textContent = key;
                    document.getElementById('resultBox').classList.add('show');
                    addLog('KẾT QUẢ: ' + key, 'success');
                    
                    navigator.clipboard.writeText(key).then(() => {
                        addLog('Đã tự copy!', 'success');
                    }).catch(() => {});
                } else {
                    addLog('Không bypass được - thử link khác', 'error');
                }
                
            } catch(e) {
                addLog('Lỗi: ' + e.message, 'error');
            }
            
            btn.disabled = false;
            btnText.innerHTML = '⚡ BYPASS LINK ⚡';
        }

        function copyKey() {
            if (currentResult) {
                navigator.clipboard.writeText(currentResult).then(() => {
                    addLog('Đã sao chép!', 'success');
                });
            }
        }

        addLog('TUNG LINH BYPASS sẵn sàng', 'success');
        addLog('Dán link -> BYPASS tự động', 'info');
    </script>
</body>
</html>
