name: TUNG LINH BYPASS DAILY

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bypass:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Chạy bypass
        run: node bypass.js

      - name: Commit kết quả
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add results.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Daily bypass $(date +%Y-%m-%d)"
          git push
